services:
  postgres:
    image: postgres:17
    container_name: gameshop-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gameshop-network

volumes:
  postgres_data:

networks:
  gameshop-network:
    driver: bridge