services:
  postgres:
    image: postgres:17
    container_name: gameshop-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - gameshop-network

volumes:
  gameshop-db:

networks:
  gameshop-network:
    driver: bridge
    name: gameshop-network